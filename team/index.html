<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="theme-color" content="#1C1F26">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>PERFORM. Team-Check</title>
<style>
@font-face{font-family:"Montserrat";font-weight:400;font-display:swap;src:url(fonts/m400.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-weight:600;font-display:swap;src:url(fonts/m600.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-weight:700;font-display:swap;src:url(fonts/m700.woff2) format("woff2")}
:root{
  color-scheme:dark;
  --bg:#1C1F26; --card:#262B34; --card2:#2D333E; --line:#34405A;
  --blue:#1D4579; --acc:#4B8EF0; --text:#F0F4FF; --muted:#9BA8C0; --dim:#6C7890;
  --red:#F87171; --amber:#F5B041; --green:#4ADE80;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Montserrat",-apple-system,system-ui,sans-serif;font-size:14.5px;line-height:1.4}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
#app{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.logo{font-size:15px;font-weight:700;letter-spacing:3px}
.logo span{color:var(--acc)}
.logo small{display:block;font-size:10.5px;letter-spacing:2px;color:var(--muted);font-weight:600;margin-top:1px}
h1{font-size:24px;font-weight:700;margin:14px 0 2px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
h2{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--acc);margin:22px 2px 10px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px}
.card ol,.card ul{margin:0;padding-left:20px}
.card li{margin:4px 0;font-size:13px}
.btn{min-height:44px;border-radius:12px;padding:0 16px;font-weight:700;font-size:14px;background:var(--card2);color:var(--text)}
.btn.pri{background:var(--acc);color:#0f1218}
.btn.danger{color:var(--red)}
.btn.sm{min-height:34px;font-size:12px;padding:0 10px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px;align-items:start}
.banner{background:#22385c;color:#cfe0fb;border-radius:12px;padding:10px 14px;font-size:13px;margin:10px 0}
.banner.red{background:#4a2227;color:#f4a3a3}
label.f{display:block;font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=date],select,textarea{width:100%;background:var(--card2);border:1px solid transparent;border-radius:12px;padding:0 12px;min-height:42px;font-size:14.5px;outline:none}
textarea{padding:10px 12px;min-height:90px;font-size:13px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
input.bad{border-color:var(--red)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-height:36px;border-radius:18px;padding:0 12px;background:var(--card2);color:var(--muted);font-size:12.5px;font-weight:700}
.chips button.on{background:var(--blue);color:var(--text)}
.hint{font-size:11.5px;color:var(--dim);margin-top:4px}
.pl{display:grid;grid-template-columns:1fr repeat(var(--n),76px);gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.pl:last-child{border-bottom:0}
.pl .nm{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl input{min-height:40px;padding:0 6px;text-align:center}
.plh{display:grid;grid-template-columns:1fr repeat(var(--n),76px);gap:6px;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);padding-bottom:4px}
.plh span{text-align:center}
@media (max-width:420px){.pl,.plh{grid-template-columns:1fr repeat(var(--n),62px);gap:4px}}
.pv{overflow-x:auto;padding:6px 0}

/* ───────── Report-Seite (A4) ───────── */
.page{overflow-wrap:anywhere;width:210mm;min-height:297mm;margin:0 auto 14px;background:#1C1F26;color:#F0F4FF;padding:10mm 13mm 9mm;box-shadow:0 0 0 1px #34405A;display:flex;flex-direction:column}
.page .ph{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #1D4579;padding-bottom:3.5mm;margin-bottom:4mm}
.page .pl{font-weight:700;letter-spacing:4px;font-size:15pt;display:block;border:0;padding:0}
.page .pl span{color:#4B8EF0}
.page .pl small{display:block;font-size:6.5pt;letter-spacing:2.5px;color:#9BA8C0;margin-top:1mm}
.page .pt{text-align:right}
.page .pt .k{font-size:7pt;font-weight:700;letter-spacing:2px;color:#4B8EF0;text-transform:uppercase}
.page .pt .t{font-size:17pt;font-weight:700;line-height:1.15;margin-top:1mm}
.page .pt .m{font-size:8.5pt;color:#9BA8C0;margin-top:1mm}
.page h3{font-size:7.5pt;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#4B8EF0;margin:4mm 0 2mm}
.page .kp{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3mm}
.page .kp div{background:#262B35;border-radius:3mm;padding:3mm 3.5mm}
.page .kp b{display:block;font-size:15pt;line-height:1.1}
.page .kp b small{font-size:7.5pt;color:#9BA8C0;margin-left:1mm;font-weight:600}
.page .kp span{display:block;font-size:6.3pt;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#9BA8C0;margin-top:1.3mm}
.page .kp em{display:block;font-style:normal;font-size:7pt;color:#9BA8C0;margin-top:1mm}
.page table{width:100%;border-collapse:collapse;font-size:8.5pt}
.page th{font-size:6.3pt;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#9BA8C0;text-align:left;padding:1.2mm 1.6mm;border-bottom:1px solid #34405A}
.page td{padding:1.1mm 1.6mm;border-bottom:1px solid #2D333E;vertical-align:top}
.page td.n,.page th.n{text-align:right;white-space:nowrap}
.page td .d{display:block;font-size:6.8pt;color:#9BA8C0}
.page .dim,.page td .d.dim{color:#6C7890}
.page .box{background:#262B35;border-radius:3mm;padding:3.5mm 5mm;font-size:8.8pt;line-height:1.5}
.page .box p{margin:0;white-space:pre-wrap}
.page .ein{margin:0;padding-left:4mm}
.page .ein li{margin:0 0 1.5mm;font-size:8.5pt;line-height:1.45}
.page .ein li:last-child{margin-bottom:0}
.page .emp{counter-reset:e;margin:0;padding:0;list-style:none}
.page .emp li{counter-increment:e;display:flex;gap:3mm;margin:0 0 2mm;font-size:8.5pt;line-height:1.42}
.page .emp li:last-child{margin-bottom:0}
.page .emp li:before{content:counter(e);flex:none;width:5.5mm;height:5.5mm;border-radius:50%;background:#1D4579;color:#fff;font-weight:700;font-size:7.5pt;display:flex;align-items:center;justify-content:center}
.page .cond{font-size:7.2pt;color:#9BA8C0;line-height:1.5}
.page .cond.fn{margin-top:auto;padding-top:3mm;font-size:6.6pt;line-height:1.45}
.page .pf{margin-top:auto;padding-top:4mm;display:flex;justify-content:space-between;font-size:6.8pt;color:#6C7890;border-top:1px solid #262B35}
.page .fn + .pf{margin-top:0}
.page .pf b{color:#9BA8C0}
.page.build{min-height:0}

@media print{
  @page{size:210mm 297mm;margin:0}
  html,body{margin:0!important;padding:0!important;background:#1C1F26!important;width:210mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .np{display:none!important}
  #app{padding:0;max-width:none}
  .pv{padding:0;overflow:visible}
  .page{margin:0;box-shadow:none;width:210mm;height:auto;min-height:0;break-after:page;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .page:last-child{break-after:auto;page-break-after:auto}
  .page *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
'use strict';

var KEY = 'perform_team_v1', SEL = 'perform_team_sel';
var LIB = '../athletik/lib/';
var ZP = ['Start Vorbereitung', 'Ende Vorbereitung', 'Zwischentest'];
var TESTS = [['cmj', 'CMJ'], ['bj', 'Broad Jump'], ['sprint', 'Sprint 30 m'], ['ift', '30-15 IFT']];
var BASE = ['cmj', 'bj', 'sprint'];
/* Felder: [Label, Einheit, min, max, Dezimalstellen, Messschwankung (relativ) bzw. abs] */
var F = {
  cmj: ['CMJ', 'cm', 5, 80, 1],
  bj:  ['Broad Jump', 'cm', 50, 400, 0],
  s10: ['10 m', 's', 1.2, 3.5, 2],
  s20: ['20 m', 's', 2.2, 5.5, 2],
  s30: ['30 m', 's', 3.2, 7.5, 2],
  ift: ['VIFT', 'km/h', 8, 25, 1]
};
var FIELDS = { cmj: ['cmj'], bj: ['bj'], sprint: ['s10', 's20', 's30'], ift: ['ift'] };

/* ───────── Helfer ───────── */
function h(tag, props) {
  var e = document.createElement(tag);
  if (props) for (var k in props) {
    var v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'value') e.value = v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  (function add(list) {
    for (var j = 0; j < list.length; j++) {
      var c = list[j];
      if (c == null || c === false) continue;
      if (Array.isArray(c)) add(c);
      else e.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
    }
  })(Array.prototype.slice.call(arguments, 2));
  return e;
}
function clean(v, max) {
  if (typeof v !== 'string') return '';
  return v.replace(/[\u0000-\u0009\u000B-\u001F\u007F‪-‮⁦-⁩]/g, '').slice(0, max);
}
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function pad(n) { return String(n).padStart(2, '0'); }
function today() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function fmtD(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? m[3] + '.' + m[2] + '.' + m[1] : ''; }
function validDate(s) { if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return false; var d = new Date(s + 'T00:00:00Z'); return !isNaN(d) && d.toISOString().slice(0, 10) === s; }
function fx(v, d) { return v == null ? '–' : v.toFixed(d).replace('.', ','); }
function sg(v, d) { if (v == null) return ''; var r = Math.abs(v) < Math.pow(10, -d) / 2 ? 0 : v; return (r > 0 ? '+' : r < 0 ? '−' : '±') + fx(Math.abs(r), d); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function mean(a) { a = a.filter(function (x) { return x != null; }); return a.length ? a.reduce(function (x, y) { return x + y; }, 0) / a.length : null; }
function num(k, raw) {
  var s = String(raw == null ? '' : raw).replace(',', '.').trim();
  if (!s) return null;
  if (!/^\d+(\.\d+)?$/.test(s)) return NaN;
  var n = parseFloat(s), f = F[k];
  if (k === 'ift' && Math.abs(n * 2 - Math.round(n * 2)) > 1e-9) return NaN;
  return n >= f[2] && n <= f[3] ? n : NaN;
}
function val(t, pid, k) { var o = t.v[pid]; if (!o) return null; var n = num(k, o[k]); return typeof n === 'number' && !isNaN(n) ? n : null; }
/* Messschwankung: Sprünge < 5 %, Sprint < 2 %, VIFT < 0,5 km/h (eine Stufe) */
function noise(k, a, b) {
  if (a == null || b == null) return false;
  if (k === 'ift') return Math.abs(a - b) < 0.5;
  var lim = k === 's10' ? 0.03 : k.charAt(0) === 's' ? 0.02 : 0.05;
  return Math.abs(a - b) / Math.abs(b) < lim;
}

/* ───────── Daten ───────── */
function sanitize(o) {
  if (!o || typeof o !== 'object' || !Array.isArray(o.teams)) return { teams: [] };
  var ch = typeof o.changed === 'number' ? o.changed : 0;
  var res = { teams: o.teams.slice(0, 50).filter(function (x) { return x && typeof x === 'object'; }).map(function (tm) {
    var players = (Array.isArray(tm.players) ? tm.players : []).slice(0, 60).filter(function (p) { return p && typeof p === 'object'; }).map(function (p) {
      return { id: typeof p.id === 'string' ? p.id.slice(0, 20) : uid(), name: clean(p.name, 40) };
    });
    var ids = {}; players.forEach(function (p) { ids[p.id] = 1; });
    return { id: typeof tm.id === 'string' ? tm.id.slice(0, 20) : uid(), name: clean(tm.name, 60), gruppe: tm.gruppe === 'Jugend' ? 'Jugend' : 'Herren', players: players,
      termine: (Array.isArray(tm.termine) ? tm.termine : []).slice(0, 30).filter(function (t) { return t && typeof t === 'object'; }).map(function (t) {
        var v = {};
        if (t.v && typeof t.v === 'object') Object.keys(t.v).forEach(function (pid) {
          if (!ids[pid] || !t.v[pid] || typeof t.v[pid] !== 'object') return;
          var o = {}; Object.keys(F).forEach(function (k) { var x = t.v[pid][k]; if (typeof x === 'string' || typeof x === 'number') o[k] = String(x).slice(0, 8); });
          v[pid] = o;
        });
        return { id: typeof t.id === 'string' ? t.id.slice(0, 20) : uid(), date: validDate(t.date) ? t.date : today(), zp: ZP.indexOf(t.zp) >= 0 ? t.zp : ZP[0],
          ug: clean(t.ug, 40), tests: Array.isArray(t.tests) ? TESTS.map(function (x) { return x[0]; }).filter(function (k) { return t.tests.indexOf(k) >= 0; }) : BASE.slice(),
          v: v, note: clean(t.note, 900), emp: clean(t.emp, 1200) };
      }) };
  }) };
  res.changed = ch;
  return res;
}
var D = (function () { try { return sanitize(JSON.parse(lsGet(KEY))); } catch (e) { return { teams: [] }; } })();
var sel = (function () { try { return JSON.parse(lsGet(SEL)) || {}; } catch (e) { return {}; } })();
var warned = false;
function save() { D.changed = Date.now(); var ok = lsSet(KEY, JSON.stringify(D)); lsSet(SEL, JSON.stringify(sel)); if (!ok && !warned) { warned = true; alert('Speichern im Browser fehlgeschlagen. Bitte Backup exportieren.'); } }

function curTeam() { return D.teams.filter(function (x) { return x.id === sel.team; })[0] || null; }
function sortedT(tm) { return tm.termine.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }); }
function curT(tm) { return tm ? tm.termine.filter(function (t) { return t.id === sel.t; })[0] || null : null; }
function prevT(tm, t) { var s = sortedT(tm), i = s.indexOf(t); return i > 0 ? s[i - 1] : null; }
function on(t, k) { return t.tests.indexOf(k) >= 0; }
function byName(a, b) { return a.name.localeCompare(b.name, 'de', { sensitivity: 'base' }); }

/* ───────── Ansicht ───────── */
var app = document.getElementById('app'), pvBox, ovBox, drawT;
function render() {
  app.textContent = '';
  var ctl = h('div', { class: 'np' });
  app.appendChild(ctl);
  ctl.appendChild(h('div', { class: 'logo' }, 'PERFORM', h('span', null, '.'), h('small', null, 'PERFORMANCE THAT LASTS.')));
  ctl.appendChild(h('h1', null, 'Team-Check'));
  ctl.appendChild(h('p', { class: 'sub' }, 'Vor Ort mit dir: CMJ, Broad Jump, Sprint 30 m (10-m-Splits), optional 30-15 IFT. Daten bleiben nur in diesem Browser.'));

  var lastBk = parseInt(lsGet(KEY + '_backup') || '0', 10) || 0;
  if (D.teams.length && D.changed && D.changed > lastBk) ctl.appendChild(h('div', { class: 'banner' }, h('b', null, 'Backup machen: '),
    'Am iPhone löscht Safari Website-Daten nach einigen Tagen ohne Besuch. Nach jedem Termin unten „Backup exportieren“ und die Datei in iCloud (Perform_) ablegen. Tipp: Seite zum Home-Bildschirm hinzufügen.'));
  var tm = curTeam(), t = curT(tm);
  if (tm && !t && tm.termine.length) { t = sortedT(tm)[tm.termine.length - 1]; sel.t = t.id; }

  /* Team + Termin wählen */
  var c0 = h('div', { class: 'card' });
  c0.appendChild(h('div', { class: 'g2' },
    h('div', null, h('label', { class: 'f', style: 'margin-top:0' }, 'Team'),
      h('select', { onchange: function (e) { sel.team = e.target.value; sel.t = null; save(); render(); } },
        h('option', { value: '' }, D.teams.length ? '– Team wählen –' : '– noch kein Team –'),
        D.teams.map(function (x) { var o = h('option', { value: x.id }, x.name || 'Ohne Namen'); if (tm && x.id === tm.id) o.selected = true; return o; }))),
    h('div', null, h('label', { class: 'f', style: 'margin-top:0' }, 'Termin'),
      tm ? h('select', { onchange: function (e) { sel.t = e.target.value; save(); render(); } }, sortedT(tm).map(function (x) {
        var o = h('option', { value: x.id }, fmtD(x.date) + ' · ' + x.zp); if (t && x.id === t.id) o.selected = true; return o; }))
        : h('select', { disabled: true }, h('option', null, '–')))));
  c0.appendChild(h('div', { class: 'row', style: 'margin-top:10px' },
    h('button', { class: 'btn sm', onclick: function () {
      var n = prompt('Name des Teams (z. B. SV Muster U19):'); if (!n || !clean(n, 60).trim()) return;
      var nt = { id: uid(), name: clean(n, 60).trim(), gruppe: /\bU\s?\d{1,2}\b|jugend|junior/i.test(n) ? 'Jugend' : 'Herren', players: [], termine: [] };
      var tt = { id: uid(), date: today(), zp: ZP[0], ug: '', tests: BASE.slice(), v: {}, note: '', emp: '' };
      nt.termine.push(tt); D.teams.push(nt); sel.team = nt.id; sel.t = tt.id; save(); render(); } }, '+ Team'),
    h('button', { class: 'btn sm', disabled: !tm, onclick: function () {
      var last = tm.termine.length ? sortedT(tm)[tm.termine.length - 1] : null;
      var tt = { id: uid(), date: today(), zp: last ? ZP[1] : ZP[0], ug: last ? last.ug : '', tests: last ? last.tests.slice() : BASE.slice(), v: {}, note: '', emp: '' };
      tm.termine.push(tt); sel.t = tt.id; save(); render(); } }, '+ Re-Test (neuer Termin)'),
    h('button', { class: 'btn sm danger', disabled: !t, onclick: function () {
      if (!confirm('Termin vom ' + fmtD(t.date) + ' löschen?')) return;
      tm.termine.splice(tm.termine.indexOf(t), 1); sel.t = null; save(); render(); } }, 'Termin löschen'),
    h('button', { class: 'btn sm danger', disabled: !tm, onclick: function () {
      if (!confirm('Team „' + tm.name + '“ mit allen Terminen löschen?')) return;
      D.teams.splice(D.teams.indexOf(tm), 1); sel.team = null; sel.t = null; save(); render(); } }, 'Team löschen')));
  ctl.appendChild(c0);

  if (tm && t) { teamForm(ctl, tm, t); entry(ctl, tm, t); notes(ctl, tm, t); }
  else ctl.appendChild(h('div', { class: 'card', style: 'color:var(--muted)' }, tm ? 'Termin anlegen: „+ Re-Test (neuer Termin)“.' : 'Team anlegen oder auswählen.'));

  protocol(ctl);
  backup(ctl);

  ctl.appendChild(h('h2', null, 'Report-Vorschau'));
  ovBox = h('div');
  ctl.appendChild(ovBox);
  pvBox = h('div', { class: 'pv' });
  app.appendChild(pvBox);
  draw();
}

function teamForm(ctl, tm, t) {
  ctl.appendChild(h('h2', null, 'Team & Termin'));
  var c = h('div', { class: 'card' });
  c.appendChild(h('div', { class: 'g2' },
    h('div', null, h('label', { class: 'f', style: 'margin-top:0' }, 'Teamname'), h('input', { type: 'text', value: tm.name, maxlength: 60, oninput: function (e) { tm.name = clean(e.target.value, 60); save(); draw(); } })),
    h('div', null, h('label', { class: 'f', style: 'margin-top:0' }, 'Gruppe'), h('div', { class: 'chips' }, ['Herren', 'Jugend'].map(function (g) {
      return h('button', { class: tm.gruppe === g ? 'on' : '', onclick: function () { tm.gruppe = g; save(); render(); } }, g); })))));

        function (e) { msg(e && e.name === 'AbortError' ? 'Teilen abgebrochen.' : 'Teilen nicht möglich (' + (e && e.name || e) + '). „PDF öffnen“ nutzen.'); });
    } else {
      var a = document.createElement('a'); a.href = pdfReady.url; a.download = pdfReady.name; document.body.appendChild(a); a.click(); a.remove();
      msg('PDF gespeichert: ' + pdfReady.name);
    }
    return;
  }
  btn.disabled = true; btn.textContent = 'PDF wird erstellt …';
  Promise.all([loadLib(LIB + 'html2canvas.min.js'), loadLib(LIB + 'jspdf.umd.min.js')])
    .then(function () { return document.fonts && document.fonts.ready ? document.fonts.ready : null; })
    .then(function () {
      var pages = Array.prototype.slice.call(pvBox.querySelectorAll('.page'));
      if (!pages.length) throw new Error('Kein Report vorhanden');
      pvBox.scrollLeft = 0;
      var doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', compress: true }), chain = Promise.resolve();
      pages.forEach(function (pg, i) {
        chain = chain.then(function () {
          return window.html2canvas(pg, { scale: 2, backgroundColor: '#1C1F26', logging: false, windowWidth: 1100, scrollX: 0, scrollY: -window.scrollY, width: pg.offsetWidth, height: pg.offsetHeight });
        }).then(function (cv) {
          if (i) doc.addPage();
          doc.setFillColor(28, 31, 38); doc.rect(0, 0, 210, 297, 'F');
          var w = 210, hh = cv.height / cv.width * 210;
          if (hh > 297) { w = 297 * cv.width / cv.height; hh = 297; }
          doc.addImage(cv.toDataURL('image/jpeg', 0.92), 'JPEG', (210 - w) / 2, 0, w, hh);
          cv.width = cv.height = 0;
        });
      });
      return chain.then(function () { return doc; });
    })
    .then(function (doc) {
      var name = 'PERFORM_Team-Check_' + ((tm.name || 'Team').replace(/[^A-Za-z0-9ÄÖÜäöüß]+/g, '_')) + '_' + t.date + '.pdf';
      var blob = doc.output('blob'), file = null;
      try { file = new File([blob], name, { type: 'application/pdf' }); } catch (e) {}
      pdfReady = { file: file, url: URL.createObjectURL(blob), name: name };
      btn.disabled = false;
      btn.textContent = file && navigator.canShare && navigator.canShare({ files: [file] }) ? 'PDF teilen' : 'PDF speichern';
      var l = document.getElementById('pdfLink');
      if (l) { l.textContent = ''; l.appendChild(h('a', { href: pdfReady.url, target: '_blank', rel: 'noopener', style: 'color:var(--acc)' }, 'PDF öffnen')); }
      msg('PDF fertig (' + Math.round(blob.size / 1024) + ' KB). Jetzt „' + btn.textContent + '“ antippen.');
    })
    .catch(function (e) { btn.disabled = false; btn.textContent = 'PDF erstellen'; msg('PDF konnte nicht erstellt werden (' + (e && e.message || e) + '). Alternativ „Drucken“ am Laptop.'); });
}

render();
})();
</script>
