<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src 'self'; img-src 'self' data:; manifest-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spieler">
<meta name="theme-color" content="#1C1F26">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>PERFORM. Spieler</title>
<style>
@font-face{font-family:"Montserrat";font-weight:400;font-display:swap;src:url(fonts/m400.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-weight:600;font-display:swap;src:url(fonts/m600.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-weight:700;font-display:swap;src:url(fonts/m700.woff2) format("woff2")}
:root{
  color-scheme:dark;
  --bg:#1C1F26; --card:#262B34; --card2:#2D333E; --line:#34405A;
  --blue:#1D4579; --acc:#4B8EF0; --text:#F0F4FF; --muted:#9BA8C0; --dim:#6C7890;
  --red:#F87171; --amber:#F5B041; --green:#4ADE80;
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Montserrat",-apple-system,system-ui,sans-serif;font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
body{min-height:100dvh;overscroll-behavior-y:none}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:var(--st);background:var(--bg);z-index:30}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
#app{max-width:560px;margin:0 auto;padding:calc(var(--st) + 18px) 16px calc(var(--sb) + 48px)}
.logo{font-size:15px;font-weight:700;letter-spacing:3px}
.logo span{color:var(--acc)}
.logo small{display:block;font-size:10.5px;letter-spacing:2px;color:var(--muted);font-weight:600;margin-top:1px}
h1{font-size:24px;font-weight:700;margin:16px 0 0;letter-spacing:-.2px;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:13px;margin:2px 0 14px}
h2{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--acc);margin:22px 2px 10px;display:flex;align-items:center;gap:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;border-left:3px solid var(--acc)}
.card.quiet{border-left-color:var(--line)}
.card.ok{border-left-color:var(--green)}
.title{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.meta{font-size:12.5px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere;white-space:pre-wrap}
.btn{min-height:48px;border-radius:12px;padding:0 16px;font-weight:700;font-size:14px;background:var(--card2);color:var(--text)}
.btn.pri{background:var(--acc);color:#0f1218}
.btn.blue{background:var(--blue);color:#fff}
.btn.ghost{background:none;color:var(--muted)}
.btn.full{width:100%}
.btn.danger{color:var(--red)}
.btn[aria-disabled=true]{opacity:.5}
.actions{display:flex;gap:8px;margin-top:12px}
.actions .btn{flex:1}
.banner{background:#22385c;color:#cfe0fb;border-radius:12px;padding:11px 14px;font-size:13px;margin:14px 0 4px}
.banner.amber{background:#4a3a14;color:var(--amber)}
.banner.red{background:#4a2227;color:#f4a3a3}
.prog{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--acc);border-radius:99px}
.two{display:flex;justify-content:space-between;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.empty{color:var(--muted);text-align:center;padding:28px 10px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;font-weight:600;background:var(--card2);border-radius:8px;padding:4px 8px;color:var(--text)}
.chip b{color:var(--muted);font-weight:600;margin-right:4px}
.vid{display:inline-flex;align-items:center;min-height:44px;color:var(--acc);font-weight:700;font-size:13px;text-decoration:none}
.stick{position:sticky;top:var(--st);z-index:15;display:flex;gap:8px;align-items:center;margin:0 -16px 6px;padding:8px 16px;background:rgba(28,31,38,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.stick .back{min-height:44px;min-width:44px;padding:0 10px;border-radius:12px;background:var(--card2);font-weight:700}
.stick .t{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stick .c{flex:none;font-size:12.5px;font-weight:700;color:var(--acc)}
/* Sätze */
.sethead,.setrow{display:grid;grid-template-columns:30px 1fr 1fr 1fr;gap:8px;align-items:center}
.sethead{margin-top:12px;font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--dim);text-align:center}
.sets{display:grid;gap:8px;margin-top:6px}
.sn{font-weight:700;color:var(--dim);text-align:center}
.setrow input{width:100%;min-width:0;min-height:48px;text-align:center;font-size:17px;font-weight:600;border-radius:10px;background:var(--bg);border:1px solid var(--line);padding:0 4px;outline:none;-webkit-appearance:none;appearance:none}
.setrow input::placeholder{color:var(--dim);font-weight:400}
.setrow input.fill{border-color:var(--acc);background:var(--card2)}
.setrow input.bad{border-color:var(--red)}
.setrow input:focus{border-color:var(--acc)}
.stp{display:flex;align-items:center;justify-content:space-between;background:var(--card2);border-radius:12px;margin-top:10px}
.stp button{width:56px;min-height:48px;font-size:24px;font-weight:700;border-radius:12px}
.stp b{font-size:13.5px}
.err{font-size:12px;color:var(--red);margin:6px 2px 0;min-height:0}
/* Formulare */
label.f{display:block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px}
.q{font-size:14.5px;font-weight:600;margin:20px 2px 8px}
.qh{font-size:12px;color:var(--muted);margin:-4px 2px 8px}
textarea,input[type=text]{width:100%;background:var(--card2);border:1px solid transparent;border-radius:12px;padding:12px 14px;font-size:16px;min-height:48px;outline:none;-webkit-appearance:none;appearance:none}
textarea:focus,input[type=text]:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:96px}
.hint{font-size:12px;color:var(--muted);margin:6px 2px 0}
.opts{display:grid;gap:8px}
.opts.c6{grid-template-columns:repeat(6,1fr)} .opts.c5{grid-template-columns:repeat(5,1fr)} .opts.c2{grid-template-columns:repeat(2,1fr)}
.opts button{min-height:48px;border-radius:12px;background:var(--card2);font-weight:700;font-size:15px;color:var(--muted)}
.opts button.on{background:var(--blue);color:#fff;box-shadow:inset 0 0 0 2px var(--acc)}
.opts button:disabled{opacity:.35}
.consent{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:14px;padding:12px 14px;margin-top:16px;border-left:3px solid var(--amber);cursor:pointer}
.consent input{flex:none;width:28px;height:28px;margin:8px 0;accent-color:var(--acc)}
.consent span{font-size:13px;line-height:1.45}
.consent .req{display:block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--amber);margin-bottom:3px}
.missing{font-size:12.5px;color:var(--amber);margin:14px 2px 0}
/* Sheet */
.ov{position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.62);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:90dvh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 16px calc(var(--sb) + 18px);border-top:1px solid var(--line)}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:4px 2px 6px;font-size:18px;font-weight:700}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--sb) + 20px);max-width:528px;margin:0 auto;z-index:60;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px}
.list .row{display:flex;gap:8px;align-items:center}
.list .row .btn{flex:none}
.foot{font-size:11.5px;color:var(--dim);text-align:center;margin-top:28px}
/* Druckansicht */
#print-root{display:none}
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff !important;color:#000 !important}
  body::before{display:none}
  body>*:not(#print-root){display:none !important}
  #print-root{display:block !important;font-family:"Montserrat",Arial,sans-serif;color:#000}
  .pp{break-after:page;page-break-after:always}
  .pp:last-child{break-after:auto;page-break-after:auto}
  .ph{border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px}
  .ph .top{display:flex;justify-content:space-between;align-items:baseline}
  .ph .lg{font-size:15px;font-weight:700;letter-spacing:2px}
  .ph .lg span{color:#1D4579}
  .ph .mt{font-size:10.5px;color:#555;font-weight:600}
  .ph .nm{font-size:18px;font-weight:700;margin-top:4px}
  .ph .fc{font-size:11px;color:#555}
  .pb{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin:10px 0 4px;color:#1D4579}
  table.pt{width:100%;border-collapse:collapse;table-layout:fixed;font-size:10.5px}
  table.pt th{font-size:8.5px;text-transform:uppercase;letter-spacing:.4px;text-align:left;color:#333;padding:3px 5px;border-bottom:1px solid #999}
  table.pt td{padding:4px 5px;border-bottom:1px solid #ddd;vertical-align:top;overflow-wrap:break-word;hyphens:none}
  table.pt tr{break-inside:avoid;page-break-inside:avoid}
  .pe{font-weight:600}
  .pn{font-size:10.5px;color:#555;margin-top:8px}
  .pa{font-size:12px;line-height:1.6}
  .pa b{display:inline-block;min-width:215px;margin-right:8px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<div id="print-root"></div>
<script>
(function () {
'use strict';

/* ───────── Konstanten ───────── */
var PFX = 'perform_player_v1:', IDX_KEY = 'perform_player_index', LAST_KEY = 'perform_player_last';
// Grenzen für eingehende Pläne. Was darüber liegt, wird abgelehnt (nicht still gekürzt).
var LIM = { code: 200000, raw: 400000, sessions: 14, blocks: 12, ex: 40, cols: 10, sets: 20 };
var UMFANG = ['0', '1', '2', '3', '4', '5+'];
var CONSENT_TEXT = 'Ich willige ein, dass meine Angabe zu Beschwerden (Ja/Nein) auf Grundlage meiner Einwilligung aus Anamnese/Betreuungsvereinbarung verarbeitet wird. Widerruf jederzeit möglich.';
var PAIN_HINT = 'Bitte kurz direkt melden, ohne Diagnose. Bei Schmerz, Schwellung oder Instabilität Training pausieren.';

/* ───────── Helfer ───────── */
function h(tag, props) {
  var e = document.createElement(tag);
  if (props) for (var k in props) {
    var v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'value') e.value = v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  (function add(list) {
    for (var j = 0; j < list.length; j++) {
      var c = list[j];
      if (c == null || c === false) continue;
      if (Array.isArray(c)) add(c);
      else e.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
    }
  })(Array.prototype.slice.call(arguments, 2));
  return e;
}
function err(msg) { var e = new Error(msg); e.user = true; return e; }
function isObj(o) { return !!o && typeof o === 'object' && !Array.isArray(o); }
// Text bereinigen: nur Strings/Zahlen, Steuerzeichen raus, Länge begrenzen. Angezeigt wird ausschließlich per textContent.
function str(v, max) {
  if (typeof v === 'number' && isFinite(v)) v = String(v);
  if (typeof v !== 'string') return '';
  return v.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F‪-‮⁦-⁩]/g, '').trim().slice(0, max);
}
function idOk(v) { return typeof v === 'string' && /^[A-Za-z0-9_-]{1,40}$/.test(v); }
function safeUrl(u) {
  u = str(u, 500); if (!u) return '';
  try { var x = new URL(u); return (x.protocol === 'https:' || x.protocol === 'http:') && !x.username && !x.password ? x.href : ''; } catch (e) { return ''; }
}
function int(v, lo, hi) { var n = typeof v === 'number' ? v : parseInt(v, 10); return n === Math.floor(n) && n >= lo && n <= hi ? n : null; }
function nz(v) { if (v === '' || v == null) return null; var n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; }
function lsGet(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
function pad(n) { return String(n).padStart(2, '0'); }
function today() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function fmtTs(s) { var d = new Date(s); return isNaN(d) ? '' : pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '. ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
var toastTimer = null;
function toast(msg) {
  var old = document.querySelector('.toast'); if (old) old.remove();
  var el = h('div', { class: 'toast', role: 'status', text: msg }); document.body.appendChild(el);
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.remove(); }, 3500);
}

/* ───────── Plan: dekodieren und streng bereinigen ───────── */
function b64urlToBytes(s) {
  if (!/^[A-Za-z0-9_-]+$/.test(s)) throw err('Der Link ist beschädigt (ungültige Zeichen).');
  s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
  var bin; try { bin = atob(s); } catch (e) { throw err('Der Link ist beschädigt.'); }
  var out = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function inflate(bytes) {
  if (typeof DecompressionStream === 'undefined') return Promise.reject(err('Dieser Browser kann den Link nicht entpacken. Bitte Browser aktualisieren oder den Plan als Text einfügen.'));
  var reader, chunks = [], total = 0;
  try { reader = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw')).getReader(); } catch (e) { return Promise.reject(err('Der Link ist beschädigt.')); }
  function pump() {
    return reader.read().then(function (r) {
      if (r.done) return;
      total += r.value.length;
      if (total > LIM.raw) { try { reader.cancel(); } catch (e) {} throw err('Der Plan ist zu groß.'); }
      chunks.push(r.value); return pump();
    });
  }
  return pump().then(function () {
    var out = new Uint8Array(total), o = 0; chunks.forEach(function (c) { out.set(c, o); o += c.length; }); return out;
  }, function (e) { throw e && e.user ? e : err('Der Link ist beschädigt (Entpacken fehlgeschlagen).'); });
}
function decodeCode(code) {
  code = String(code || '').trim();
  if (!code) return Promise.reject(err('Im Link steckt kein Plan.'));
  if (code.length > LIM.code) return Promise.reject(err('Der Link ist zu lang.'));
  var mode = code.charAt(0), bytes;
  try { bytes = b64urlToBytes(code.slice(1)); } catch (e) { return Promise.reject(e); }
  var p = mode === 'd' ? inflate(bytes) : mode === 'r' ? Promise.resolve(bytes) : Promise.reject(err('Unbekanntes Link-Format.'));
  return p.then(function (b) {
    if (b.length > LIM.raw) throw err('Der Plan ist zu groß.');
    var txt; try { txt = new TextDecoder('utf-8', { fatal: true }).decode(b); } catch (e) { throw err('Der Link ist beschädigt (Zeichensatz).'); }
    return parsePlanText(txt);
  });
}
function parsePlanText(txt) {
  if (txt.length > LIM.raw) throw err('Der Plan ist zu groß.');
  var o; try { o = JSON.parse(txt); } catch (e) { throw err('Das ist kein gültiger Plan (JSON fehlerhaft).'); }
  return sanitizePlan(o);
}
// Eingabe aus dem Textfeld: kompletter Link, nur der Code oder Plan-JSON.
function parseAnyInput(t) {
  t = String(t || '').trim();
  if (!t) return Promise.reject(err('Das Feld ist leer.'));
  if (t.length > LIM.raw) return Promise.reject(err('Der Text ist zu lang.'));
  if (t.charAt(0) === '{') { try { return Promise.resolve(parsePlanText(t)); } catch (e) { return Promise.reject(e); } }
  var i = t.indexOf('#p='); if (i >= 0) t = t.slice(i + 3); else if (t.slice(0, 2) === 'p=') t = t.slice(2);
  return decodeCode(t);
}
function arr(a, max, what) {
  if (a == null) return [];
  if (!Array.isArray(a)) throw err('Plan fehlerhaft: ' + what + ' ist keine Liste.');
  if (a.length > max) throw err('Plan zu groß: mehr als ' + max + ' ' + what + '.');
  return a;
}
function sanitizePlan(o) {
  if (!isObj(o)) throw err('Das ist kein PERFORM-Plan.');
  if (o.app !== 'perform-plan') throw err('Das ist kein PERFORM-Plan.');
  if (o.v !== 1) throw err('Diese Planversion (' + str(o.v, 6) + ') kann die App nicht lesen. Bitte neuen Link anfordern.');
  if (!idOk(o.id)) throw err('Plan-ID fehlt oder ist ungültig.');
  var week = int(o.week, 1, 52); if (week == null) throw err('Woche fehlt oder ist ungültig.');
  var cols = arr(o.cols, LIM.cols, 'Spalten').map(function (c) {
    if (!Array.isArray(c)) return null;
    var k = str(c[0], 30), l = str(c[1], 30);
    return /^[A-Za-z0-9_-]+$/.test(k) && l ? { k: k, l: l } : null;
  }).filter(Boolean);
  var seen = {};
  function uniq(id, fb) { var x = idOk(id) ? id : fb; while (seen[x]) x += '_'; seen[x] = 1; return x; }
  var sessions = arr(o.sessions, LIM.sessions, 'Einheiten').filter(isObj).map(function (s, si) {
    var sid = uniq(s.id, 's' + si);
    var blocks = arr(s.blocks, LIM.blocks, 'Blöcke').filter(isObj).map(function (b, bi) {
      var ex = arr(b.ex, LIM.ex, 'Übungen je Block').filter(isObj).map(function (e, ei) {
        var m = arr(e.m, LIM.cols, 'Werte').slice(0, cols.length).map(function (v) { return str(v, 40); });
        while (m.length < cols.length) m.push('');
        return { id: uniq(e.id, sid + 'b' + bi + 'e' + ei), name: str(e.name, 100), m: m, cue: str(e.cue, 400), video: safeUrl(e.video) };
      }).filter(function (e) { return e.name; });
      return { name: str(b.name, 60), color: typeof b.color === 'string' && /^#[0-9a-fA-F]{6}$/.test(b.color) ? b.color : '#4B8EF0', ex: ex };
    }).filter(function (b) { return b.ex.length; });
    return { id: sid, name: str(s.name, 80) || 'Einheit ' + (si + 1), focus: str(s.focus, 120), note: str(s.note, 1000), blocks: blocks };
  }).filter(function (s) { return s.blocks.length; });
  if (!sessions.length) throw err('Der Plan enthält keine Übungen.');
  var ref = str(o.ref, 12); if (!/^[A-Za-z0-9-]*$/.test(ref)) ref = '';
  return { app: 'perform-plan', v: 1, id: o.id, title: str(o.title, 80), week: week, weeks: int(o.weeks, 1, 52), ref: ref, notes: str(o.notes, 2000), cols: cols, sessions: sessions };
}

/* ───────── Speicher (ein Key pro Plan) ───────── */
function emptyAns() { return { umfang: '', belastung: null, schlaf: null, beschwerden: null, anmerkung: '' }; }
function cleanVal(v) { return str(v, 8).replace(/[^0-9.\-]/g, ''); }
function sanitizeRec(o) {
  if (!isObj(o) || o.v !== 1) throw err('Gespeicherte Daten unlesbar.');
  var plan = sanitizePlan(o.plan), log = {};
  if (isObj(o.log)) Object.keys(o.log).slice(0, 50).forEach(function (sid) {
    var se = o.log[sid]; if (!idOk(sid) || !isObj(se)) return;
    log[sid] = {};
    Object.keys(se).slice(0, 600).forEach(function (eid) {
      if (!idOk(eid) || !Array.isArray(se[eid])) return;
      log[sid][eid] = se[eid].slice(0, LIM.sets).map(function (z) { z = isObj(z) ? z : {}; return { r: cleanVal(z.r), l: cleanVal(z.l), e: cleanVal(z.e) }; });
    });

function sheetDone(how, name) {
  sheet('Woche exportiert', [
    h('div', { class: 'meta', text: how === 'share' ? 'Die Datei wurde an die gewählte App übergeben.' : 'Datei gespeichert: ' + name + '. Hänge sie in Mail oder Messenger an und sende sie an deinen Coach.' }),
    h('div', { class: 'meta', text: 'Zum Lesen gibt es zusätzlich eine PDF-Ansicht: „PDF / Drucken“ → „Als PDF sichern“.' }),
    h('div', { class: 'actions' }, h('button', { class: 'btn', type: 'button', text: 'Schließen', onclick: function () { closeSheet(); go('home'); } }), h('button', { class: 'btn blue', type: 'button', text: 'PDF / Drucken', onclick: function () { closeSheet(); printWeek(); } }))
  ]);
}

/* ───────── Druckansicht (ein Blatt pro Einheit) ───────── */
function setTxt(z) { var o = setOut(z); return (o.wdh != null ? o.wdh : '–') + (o.last != null ? ' × ' + String(o.last).replace('.', ',') : '') + (o.rpe != null ? ' @' + String(o.rpe).replace('.', ',') : ''); }
function printWeek() {
  var root = document.getElementById('print-root'), p = rec.plan, a = rec.ans;
  root.textContent = '';
  function head(name, focus) {
    return h('div', { class: 'ph' }, h('div', { class: 'top' }, h('div', { class: 'lg' }, 'PERFORM', h('span', { text: '.' })), h('div', { class: 'mt', text: 'Woche ' + p.week + (p.ref ? ' · ' + p.ref : '') + ' · Stand ' + fmtTs(new Date().toISOString()) })),
      h('div', { class: 'mt', text: p.title }), h('div', { class: 'nm', text: name }), focus ? h('div', { class: 'fc', text: focus }) : null);
  }
  p.sessions.forEach(function (s) {
    var page = h('div', { class: 'pp' }, head(s.name, s.focus));
    s.blocks.forEach(function (b) {
      page.appendChild(h('div', { class: 'pb', text: b.name || 'Block' }));
      var tb = h('tbody');
      b.ex.forEach(function (x) {
        var vg = []; p.cols.forEach(function (c, i) { if (x.m[i]) vg.push(c.l + ' ' + x.m[i]); });
        var z = (setsOf(s.id, x) || []).filter(filled);
        tb.appendChild(h('tr', null, h('td', { class: 'pe', text: x.name }), h('td', { text: vg.join(' · ') }), h('td', { text: z.length ? z.map(setTxt).join('  |  ') : 'nicht eingetragen' })));
      });
      page.appendChild(h('table', { class: 'pt' }, h('colgroup', null, h('col', { style: 'width:30%' }), h('col', { style: 'width:30%' }), h('col', { style: 'width:40%' })),
        h('thead', null, h('tr', null, h('th', { text: 'Übung' }), h('th', { text: 'Vorgabe' }), h('th', { text: 'Ist (Wdh × Last @RPE)' }))), tb));
    });
    root.appendChild(page);
  });
  function row(k, v) { return h('div', null, h('b', { text: k }), v == null || v === '' ? '–' : String(v)); }
  root.appendChild(h('div', { class: 'pp' }, head('Wochenfragen', ''), h('div', { class: 'pa' },
    rec.name ? row('Name', rec.name) : null,
    row('Einheiten absolviert', a.umfang), row('Belastungsempfinden (1–10)', a.belastung), row('Schlaf & Erholung (1–5)', a.schlaf),
    row('Beschwerden', a.beschwerden == null ? '' : a.beschwerden ? 'Ja' : 'Nein'), row('Anmerkung', a.anmerkung.trim())),
    h('div', { class: 'pn', text: rec.consent ? 'Einwilligung zur Angabe „Beschwerden (Ja/Nein)“ erteilt am ' + fmtTs(rec.consentAt) + '.' : 'Keine Einwilligung erteilt.' })));
  setTimeout(function () { window.print(); }, 50);
}
window.addEventListener('afterprint', function () { document.getElementById('print-root').textContent = ''; });

/* ───────── Render & Start ───────── */
function render() {
  var app = document.getElementById('app'); app.textContent = '';
  var nodes = !rec || view.name === 'start' ? viewStart() : view.name === 'sess' ? viewSession() : view.name === 'week' ? viewWeek() : viewHome();
  (function add(list) { list.forEach(function (n) { if (Array.isArray(n)) add(n); else if (n) app.appendChild(n); }); })(nodes);
}
function boot() {
  var hash = location.hash || '';
  var m = hash.match(/^#p=(.*)$/);
  if (m) {
    decodeCode(m[1]).then(function (plan) {
      openPlan(plan);
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
      go('home', 0, false);
    }, function (e) {
      startError = (e && e.user ? e.message : 'Der Link konnte nicht gelesen werden.') + ' Deine gespeicherten Daten sind unverändert.';
      rec = null; go('start', 0, false);
    });
    return;
  }
  var last = lsGet(LAST_KEY, '');
  if (last && idOk(last)) rec = loadRec(last);
  var st = history.state; // nach Reload in derselben Ansicht bleiben
  if (rec && st && (st.v === 'sess' || st.v === 'week')) go(st.v, int(st.si, 0, LIM.sessions) || 0, false);
  else go(rec ? 'home' : 'start', 0, false);
}
try { localStorage.setItem('perform_player_probe', '1'); localStorage.removeItem('perform_player_probe'); } catch (e) { storageOK = false; }
window.__pl = { parseAnyInput: parseAnyInput, sanitizePlan: sanitizePlan, buildExport: buildExport, get rec() { return rec; } };
boot();
})();
