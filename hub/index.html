<title>PERFORM. Hub</title>
<style>

@font-face{font-family:"Montserrat";font-weight:600;font-display:swap;src:url(fonts/m600.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-weight:700;font-display:swap;src:url(fonts/m700.woff2) format("woff2")}

  --red:#F87171; --amber:#F5B041; --green:#4ADE80;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Montserrat",-apple-system,system-ui,sans-serif;font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
body{min-height:100dvh;overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
#app{max-width:560px;margin:0 auto;padding:calc(var(--st) + 18px) 16px calc(var(--tab) + var(--sb) + 96px)}
h1{font-size:26px;font-weight:700;margin:0;letter-spacing:-.2px}
.sub{color:var(--muted);font-size:13px;margin:2px 0 18px}
h2{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--acc);margin:22px 2px 10px}
.card{background:var(--card);border-radius:14px;padding:14px 14px;margin-bottom:10px;border-left:3px solid var(--acc)}
.card.quiet{border-left-color:var(--line)}
.card.late{border-left-color:var(--red)}
.card.done{opacity:.55}
.row{display:flex;gap:12px;align-items:flex-start}
.grow{flex:1;min-width:0}
.title{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.meta.red{color:var(--red)} .meta.amber{color:var(--amber)}
.chk{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;margin:-4px 0 -4px -4px}
.chk svg{width:22px;height:22px;stroke:var(--bg);opacity:0}
.chk.on{background:var(--acc);border-color:var(--acc)} .chk.on svg{opacity:1}
.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:5px 10px;border-radius:99px;background:var(--card2);color:var(--muted)}
.pill.s-antwortet{background:#22385c;color:#9cc0f7}
.pill.s-Gespräch{background:#4a3a14;color:var(--amber)}
.pill.s-Zusage{background:#14412a;color:var(--green)}
.pill.s-Absage{background:#4a2227;color:#f4a3a3}
.pill.s-kalt{background:#2a2f3a;color:var(--dim)}
.pill.fmt{background:#22385c;color:#9cc0f7}
button.pill{min-height:40px;padding:0 12px}
.tag{font-size:10.5px;font-weight:600;color:var(--muted);background:var(--card2);padding:2px 8px;border-radius:6px;margin-left:6px;vertical-align:1px}
.actions{display:flex;gap:8px;margin-top:12px}
.btn{min-height:46px;border-radius:12px;padding:0 16px;font-weight:700;font-size:14px;background:var(--card2);color:var(--text)}
.btn.pri{background:var(--acc);color:#0f1218}
.btn.blue{background:var(--blue)}
.btn.ghost{background:none;color:var(--muted)}
.btn.flex{flex:1}
.btn.danger{color:var(--red)}
.empty{color:var(--muted);text-align:center;padding:34px 10px;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:99px;background:var(--card);color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.chip.on{background:var(--blue);color:#fff}
.seg{display:flex;background:var(--card);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;min-height:42px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--blue);color:#fff}
.big{font-size:56px;font-weight:700;line-height:1;letter-spacing:-1px}
.big small{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:6px}
.stepper{display:flex;align-items:center;gap:6px;margin-top:14px}
.stepper button{width:56px;height:56px;border-radius:16px;background:var(--card2);font-size:26px;font-weight:700}
.stepper .lbl{flex:1;text-align:center;font-size:13px;color:var(--muted)}
.prog{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--acc);border-radius:99px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv b{font-weight:700}
.week{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);margin:18px 2px 8px}
textarea,input[type=text],input[type=date],input[type=number]{width:100%;background:var(--card2);border:1px solid transparent;border-radius:12px;padding:12px 14px;font-size:16px;min-height:48px;outline:none;-webkit-appearance:none;appearance:none}
textarea:focus,input:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:84px}
label.f{display:block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:16px 2px 7px}
.hint{font-size:12px;color:var(--amber);margin:6px 2px 0}
.mini{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.mini button{min-height:36px;padding:0 12px;border-radius:99px;background:var(--card2);font-size:12.5px;font-weight:600;color:var(--muted)}
.opts{display:grid;gap:8px}
.opts.c3{grid-template-columns:repeat(3,1fr)} .opts.c2{grid-template-columns:repeat(2,1fr)}
.opts button{min-height:48px;border-radius:12px;background:var(--card2);font-weight:600;font-size:13.5px;color:var(--muted)}
.opts button.on{background:var(--blue);color:#fff}
/* Tab bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(28,31,38,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--sb)}
nav .in{max-width:560px;margin:0 auto;display:flex;height:var(--tab)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--dim);font-size:10.5px;font-weight:700;letter-spacing:.3px;position:relative}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--acc)}
nav .badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#0f1218;font-size:10.5px;display:grid;place-items:center;padding:0 5px}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(var(--tab) + var(--sb) + 18px);z-index:19;width:60px;height:60px;border-radius:20px;background:var(--acc);color:#0f1218;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.fab svg{width:28px;height:28px;stroke-width:2.6}
/* Sheet */
.ov{position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.62);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:90dvh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 16px calc(var(--sb) + 18px);border-top:1px solid var(--line);-webkit-overflow-scrolling:touch}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:4px 2px 4px;font-size:18px;font-weight:700}
.foot{display:flex;gap:10px;margin-top:22px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--tab) + var(--sb) + 90px);max-width:528px;margin:0 auto;z-index:60;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:13.5px}
.toast span{flex:1}
.toast button{color:var(--acc);font-weight:700;min-height:40px;padding:0 6px}
.banner{background:#4a3a14;color:var(--amber);border-radius:12px;padding:11px 14px;font-size:13px;margin-bottom:14px;width:100%;text-align:left}
.banner.red{background:#4a2227;color:#f4a3a3}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;flex:none}
.swrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent;flex:none}
.sw.on{border-color:#fff}
.opts button .dot{vertical-align:0}
details summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--muted);font-weight:700;font-size:13px}
details summary::-webkit-details-marker{display:none}
pre.out{white-space:pre-wrap;word-break:break-all;font-size:11px;background:var(--card2);padding:12px;border-radius:12px;max-height:200px;overflow:auto;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin:8px 2px}
</style>
</head>

  var fol = state.pipeline.filter(function (c) { return c.followDate && c.followDate <= t && CLOSED.indexOf(c.status) < 0; }).sort(function (a, b) { return a.followDate < b.followDate ? -1 : 1; });

}

function viewPipe() {
  var out = [h('h1', { text: 'Kontakte' }), h('div', { class: 'sub', text: state.pipeline.length + (state.pipeline.length === 1 ? ' Kontakt' : ' Kontakte') })];
  var cnt = {}; STATUSES.forEach(function (s) { cnt[s] = state.pipeline.filter(function (c) { return c.status === s; }).length; });
  out.push(h('div', { class: 'chips' }, ['Alle'].concat(STATUSES).map(function (s) {

  })));

}

function viewTpl() {

        h('div', { class: 'meta', style: 'white-space:pre-wrap;margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden', text: t.text })),
      h('div', { class: 'actions', style: 'margin-top:10px' },
        h('button', { class: 'btn blue flex', type: 'button', text: 'Kopieren', onclick: function () { copyText(t.text); } }),

}
function viewWinter() {
  var w = state.winter, free = Math.max(0, w.total - w.taken), t = today(), dl = diff(w.deadline, t);
  var out = [h('h1', { text: 'Winter-Coaching' }), h('div', { class: 'sub', text: 'Plätze, Anmeldeschluss, Warteliste' })];
  out.push(h('div', { class: 'card' },
    h('div', { class: 'big' }, String(free), h('small', { text: free === 1 ? 'Platz frei' : 'Plätze frei' })),
    h('div', { class: 'prog' }, h('i', { style: 'width:' + (w.total ? Math.round(w.taken / w.total * 100) : 0) + '%' })),
    h('div', { class: 'meta', text: w.taken + ' von ' + w.total + ' belegt' }),
    h('div', { class: 'stepper' },
      h('button', { type: 'button', text: '−', 'aria-label': 'Einen Platz weniger belegt', onclick: function () { if (w.taken > 0) { w.taken--; changed(); } } }),
      h('div', { class: 'lbl', text: 'belegt' }),
      h('button', { type: 'button', text: '+', 'aria-label': 'Einen Platz mehr belegt', onclick: function () { if (w.taken < w.total) { w.taken++; changed(); } } }))));
  out.push(h('div', { class: 'card quiet' },
    h('div', { class: 'kv' }, h('span', { text: 'Anmeldeschluss' }), h('b', { text: fmt(w.deadline) + ' ' + w.deadline.slice(0, 4) })),
    h('div', { class: 'kv' }, h('span', { text: 'Stand' }), h('b', { style: dl < 0 ? 'color:var(--red)' : (dl <= 3 ? 'color:var(--amber)' : ''), text: dl > 1 ? 'noch ' + dl + ' Tage' : dl === 1 ? 'noch 1 Tag' : dl === 0 ? 'heute letzter Tag' : 'abgelaufen' })),
    h('button', { class: 'btn ghost', type: 'button', style: 'width:100%;margin-top:6px', text: 'Plätze / Datum ändern', onclick: editWinter })));
  out.push(h('h2', { text: 'Platzregel' }));
  var ta = h('textarea', { placeholder: 'Noch nicht festgelegt', maxlength: 1000, 'aria-label': 'Platzregel' });
  ta.value = w.rule; ta.addEventListener('blur', function () { var v = ta.value.trim(); if (v !== w.rule) { w.rule = v.slice(0, 1000); save(); } });

  out.push(h('h2', { text: 'Warteliste · ' + w.waitlist.length }));

      h('div', { class: 'grow' }, h('div', { class: 'title', text: (i + 1) + '. ' + x.name }), x.date ? h('div', { class: 'meta', text: 'Angefragt ' + fmt(x.date) }) : null),
      h('button', { class: 'btn', type: 'button', text: 'Entfernen', 'aria-label': x.name + ' entfernen', onclick: function () { var idx = w.waitlist.indexOf(x); w.waitlist.splice(idx, 1); changed(); toast(x.name + ' entfernt', function () { w.waitlist.splice(idx, 0, x); changed(); }); } }))));
  });
  out.push(h('button', { class: 'btn blue', type: 'button', style: 'width:100%', text: '+ Warteliste', onclick: addWait }));
  var ans = state.pipeline.filter(function (c) { return c.msgDate; }).length;
  var gesp = state.pipeline.filter(function (c) { return c.status === 'Gespräch' || c.status === 'Zusage'; }).length;

function viewCal() {
  var t = today(), out = [h('h1', { text: 'Content' }), h('div', { class: 'sub', text: 'Reels Mo + Fr · Carousels Mi' })];
  out.push(h('div', { class: 'seg' },
    h('button', { class: calMode === 'next' ? 'on' : '', type: 'button', text: 'Offen', onclick: function () { calMode = 'next'; render(); } }),
    h('button', { class: calMode === 'all' ? 'on' : '', type: 'button', text: 'Alle', onclick: function () { calMode = 'all'; render(); } })));
  var list = state.posts.filter(function (p) { return calMode === 'all' || !p.done; }).sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });

  var cur = '';

function exportJson() {
  return JSON.stringify({ app: 'perform-hub', version: 1, exported: new Date().toISOString(), tasks: state.tasks, pipeline: state.pipeline, winter: state.winter, posts: state.posts, templates: state.templates, cats: state.cats }, null, 1);
}
function applyImport(text, replace) {

  ['tasks', 'pipeline', 'posts', 'templates', 'cats'].forEach(function (k) { if (has(k)) state[k] = replace ? inc[k] : merge(state[k], inc[k]); });
  ensureCats(state);
  if (data.winter && typeof data.winter === 'object') state.winter = normWinter(data.winter, state.winter);
  return inc.tasks.length + ' Aufgaben, ' + inc.pipeline.length + ' Kontakte, ' + inc.posts.length + ' Posts' + (has('templates') ? ', ' + inc.templates.length + ' Vorlagen' : '');
}
function viewMore() {
  var out = [h('h1', { text: 'Mehr' }), h('div', { class: 'sub', text: 'Sicherung der Daten' })];
  var lb = parseInt(lsGet(BK_KEY, '0'), 10) || 0;
  var days = lb ? Math.floor((Date.now() - lb) / 86400000) : null;
  out.push(h('div', { class: 'card quiet' },
    h('div', { class: 'kv' }, h('span', { text: 'Gespeichert' }), h('b', { text: counts() })),
    h('div', { class: 'kv' }, h('span', { text: 'Letztes Backup' }), h('b', { style: days === null || days >= 7 ? 'color:var(--amber)' : '', text: days === null ? 'noch nie' : days === 0 ? 'heute' : days === 1 ? 'gestern' : 'vor ' + days + ' Tagen' }))));
  var msg = h('div', { class: 'note', id: 'msg', role: 'status' });
  var exp = h('pre', { class: 'out', style: 'display:none' });
  out.push(h('h2', { text: 'Sichern' }),
    h('button', { class: 'btn pri', type: 'button', style: 'width:100%', text: 'Daten als Text kopieren', onclick: function () {
      var txt = exportJson(); exp.textContent = txt; exp.style.display = 'block';
      function ok() { lsSet(BK_KEY, String(Date.now())); msg.textContent = 'Kopiert. Füge den Text in Notizen oder Nachrichten ein und bewahre ihn dort auf.'; }
      function fallback() { var r = document.createRange(); r.selectNodeContents(exp); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); msg.textContent = 'Kopieren nicht möglich. Der Text ist markiert: lange tippen, Kopieren wählen.'; }

    } }),
    h('button', { class: 'btn', type: 'button', style: 'width:100%;margin-top:8px', text: 'Als Datei speichern', onclick: function () {
      var blob = new Blob([exportJson()], { type: 'application/json' }), name = 'PERFORM_Hub_' + today() + '.json';
      function dl() { var a = h('a', { href: URL.createObjectURL(blob), download: name }); document.body.appendChild(a); a.click(); a.remove(); lsSet(BK_KEY, String(Date.now())); msg.textContent = 'Datei gespeichert: ' + name; }
      try { var f = new File([blob], name, { type: 'application/json' }); if (navigator.canShare && navigator.canShare({ files: [f] })) { navigator.share({ files: [f], title: name }).then(function () { lsSet(BK_KEY, String(Date.now())); render(); }, function (e) { if (!e || e.name !== 'AbortError') dl(); }); return; } } catch (e) { }

    var f = fileIn.files && fileIn.files[0]; fileIn.value = ''; if (!f) return;
    var r = new FileReader(); r.onload = function () { imp.value = String(r.result); msg2.textContent = 'Datei geladen. Jetzt „Zusammenführen“ tippen.'; }; r.readAsText(f);

    h('button', { class: 'btn ghost', type: 'button', style: 'width:100%;margin-top:8px', text: 'Aus Datei laden', onclick: function () { fileIn.click(); } }), fileIn, msg2,
    h('div', { class: 'note', text: 'Zusammenführen überschreibt Einträge mit gleicher Kennung und lässt den Rest unverändert. Die Daten liegen nur auf diesem Gerät, in dieser App. Wer das iPhone zurücksetzt oder die App löscht, verliert sie ohne Sicherung.' }));

}

/* ───────── Render ───────── */

  var y = window.scrollY; app.textContent = ''; views[tab]().forEach(function (n) { app.appendChild(n); });
  var tabs = document.getElementById('tabs'); tabs.textContent = '';

    tabs.appendChild(h('button', { class: tab === t[0] ? 'on' : '', type: 'button', 'aria-label': t[1], 'aria-current': tab === t[0] ? 'page' : null, onclick: function () { setTab(t[0]); } },
      svg(t[2]), h('span', { text: t[1] }), t[0] === 'today' && n ? h('span', { class: 'badge', text: String(n) }) : null));
  });
  var fab = document.getElementById('fab'); fab.textContent = ''; fab.appendChild(svg(IC.plus));
  var act = { today: editTask, pipe: editContact, winter: addWait, tpl: editTpl, cal: editPost }[tab];

  fab.setAttribute('aria-label', { today: 'Aufgabe hinzufügen', pipe: 'Kontakt hinzufügen', winter: 'Auf die Warteliste', tpl: 'Vorlage hinzufügen', cal: 'Post hinzufügen' }[tab] || 'Hinzufügen');
  window.scrollTo(0, y);
}
document.addEventListener('visibilitychange', function () { if (!document.hidden && !document.getElementById('layer').firstChild) render(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });
render();
window.__hub = { get state() { return state; }, render: render };
})();
